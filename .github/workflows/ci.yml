name: CI

# Runs on every PR and every push to main. Before this existed the repo had no
# CI at all — every check was run by hand, and three real defects reached main
# as a result: two type errors in spec files and an API that would not boot.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Real Postgres and Redis rather than mocks: `migrate deploy` below
      # replays all migrations from an empty database, which nothing else
      # tests — the shared Neon database was built up incrementally and has
      # never been rebuilt from scratch.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nenjam_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      # NODE_ENV must be development: ElasticsearchService only tolerates an
      # unreachable cluster in development. Under production it aborts startup,
      # which would fail the smoke boot for the wrong reason.
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nenjam_ci
      REDIS_URL: redis://localhost:6379
      # Required by validation, deliberately unreachable — the app must degrade.
      ELASTICSEARCH_NODE: http://localhost:9200
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      JWT_SECRET: ci-only-not-a-real-secret-000000
      LOG_LEVEL: warn
      # Firebase, AWS and RESEND_API_KEY are intentionally absent. All are
      # optional by design, so their absence is itself part of what CI proves:
      # the app boots, and MailModule binds the no-op provider, without any
      # third-party secret. No production credential is ever needed here.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Replay all migrations onto an empty database
        run: pnpm prisma migrate deploy

      - name: Verify schema matches migrations
        # Catches the failure mode that cost this project real time: a schema
        # change applied to a shared database but never committed as a
        # migration. `migrate status` cannot detect this — it only looks for
        # unapplied local folders, and reports "up to date" when the database
        # is ahead. `migrate diff` is the check that actually works.
        run: |
          DIFF=$(pnpm exec prisma migrate diff \
            --from-config-datasource \
            --to-schema libs/database/prisma/schema.prisma)
          echo "$DIFF"
          if ! echo "$DIFF" | grep -q "No difference detected"; then
            echo "::error::schema.prisma and the migration history disagree."
            exit 1
          fi

      - name: Type-check
        # The gate that would have caught both spec-file type errors. `nest
        # build` uses tsconfig.app.json, which excludes *.spec.ts entirely.
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Test
        run: pnpm test

      - name: Build all apps
        run: pnpm build:all

      - name: Smoke boot
        # The gate that would have caught the API failing to start. Builds and
        # unit tests both pass on an unresolvable dependency graph.
        run: node scripts/smoke-boot.mjs

      - name: Lint
        # Non-blocking for now: 38 pre-existing errors in code that predates
        # this workflow, mostly @typescript-eslint rules that --fix cannot
        # resolve. Surfaced so the count is visible and trending down. Flip to
        # blocking (delete this line) once it reaches zero.
        continue-on-error: true
        run: pnpm exec eslint "{apps,libs}/**/*.ts"

  frontend:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Must match the floor in Frontend/pubspec.yaml. Validating against
          # an SDK nobody develops on lets version-specific breakage through
          # in both directions — see that pubspec comment.
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos is required, not cosmetic: `flutter analyze` exits 1
        # on ANY issue, infos included, and this project has 5 pre-existing
        # deprecation infos (cacheExtent, onReorder). Errors and warnings are
        # still fatal — the asset_does_not_exist warnings the step above
        # prevents would fail the job even with this flag.
        #
        # Worth knowing locally too: `flutter analyze` returning 1 does not
        # imply a real problem. Read the issue severities, not just the exit
        # code.
        run: flutter analyze --no-fatal-infos

      - name: Test (fast)
        # Everything except the 'heavy' tag — five files (the full responsive
        # matrices, the real-ProfileDetailPage diagnostic, the profile-edit
        # nested scroll check, and the profile-menu percentage x width sweep)
        # that dominate the suite's tail without adding proportional PR
        # feedback value. They still run in full on main — see the step below.
        #
        # Deliberately no --coverage: it slows the run and nothing consumes the
        # lcov output today. Add it when a coverage gate exists to read it.
        run: flutter test --exclude-tags=heavy

      - name: Test (heavy — main only)
        # The five 'heavy' files, run only on main so a merge still gets full
        # regression coverage (the responsive matrix, the real ProfileDetailPage
        # tree, bottom-nav clearance, etc.) without adding their tail latency to
        # every PR's feedback loop.
        if: github.ref == 'refs/heads/main'
        run: flutter test --tags=heavy

      - name: Build web (release)
        # The web build is what Vercel serves, and it catches a different class
        # of breakage from analyze: a dart:io / native-only import that compiles
        # for Android but not for the browser. It needs no Gradle or native
        # toolchain, so it is cheap. Uses only committed files (pubspec bundles
        # .env.example, never the git-ignored per-flavour .env.* files).
        run: flutter build web --release

      # No Android `flutter build` here on purpose — it pulls the whole
      # Gradle/AGP toolchain and adds several minutes for little extra signal
      # over analyze. Revisit if an Android-only build breakage ever ships.

  agent-portal:
    name: Agent Portal (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-portal/package-lock.json

      - name: Install (lockfile only)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit, component and route tests
        run: npm test

      - name: Production build
        # The real production API URL (public; no secret). The build refuses
        # mocks and fails clearly on a missing or invalid URL.
        env:
          VITE_API_BASE_URL: https://nenjam-matrimony.onrender.com
        run: npm run build

      - name: Production bundle contains no mock API
        run: |
          if grep -rqE "MockAgentApi|mock-challenge" dist; then
            echo "The production bundle includes the mock API." >&2
            exit 1
          fi
