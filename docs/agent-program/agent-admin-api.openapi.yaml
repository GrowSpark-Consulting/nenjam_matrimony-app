        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/UnauthorizedOrStepUp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409':
          description: '`PAN_NOT_SET` or `PAYOUT_DETAILS_NOT_SET`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/agents/{id}/pan/verify:
    post:
      tags: [Admin agents]
      summary: Mark the agent's PAN as verified
      operationId: adminAgentPanVerify
      x-permission: agent.payout_details.verify
      x-readiness: after-phase1-migration
      x-audit-action: agent.pan.verify
      description: |
        Sets `pan_verified_at` (needs the `pan_verified_at` column added to the
        Phase 1 migration). Payout eligibility requires it before the first
        payout (`PAN_NOT_VERIFIED`). The admin checks the PAN against the
        agent's documents after a `reveal` of `PAN`.

        **Allowed when the agent is `ACTIVE`, `SUSPENDED` or `TERMINATED`**
        (the same states as `payout-details/verify`). Not allowed for
        `PENDING_APPROVAL` or `REJECTED`. `409 PAN_NOT_SET` when no PAN is on
        file; `409 PAN_ALREADY_VERIFIED` when it already is. Replacing the
        PAN (a rejected agent re-applying with a different one) clears
        `pan_verified_at`.

        Same permission as the payout-details check, so one staff role does
        both.
      parameters:
