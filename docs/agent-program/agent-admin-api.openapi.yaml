openapi: 3.0.3
info:
  title: Nenjam Agent / Partner Program - Admin API
  version: 0.1.0-draft
  description: |
    DRAFT contract for the staff-facing (admin) endpoints of the agent
    program, written **for Shaaz to review**. Nothing here is implemented.
    It complements `agent-api.openapi.yaml` (the agent's own API); the two are
    kept apart on purpose.

    **Who calls it.** Staff only, through the admin panel. Every route is on an
    `@AdminController` (Firebase identity, then `AdminGuard`: active staff,
    admin session, permissions) and carries exactly one `@RequirePermissions`
    key, named on every operation below as `x-permission`.

    **Conventions (taken from `feat/admin-rbac-foundation`, PR #129)**
    - Two credentials on every request: `Authorization: Bearer <Firebase ID
      token>` and `X-Admin-Session: <admin session token>` (from
      `POST /admin/auth/session`). Both are documented as security schemes.
    - **Permissions** are `<resource>.<action>` keys. A missing key is
      `403 ADMIN_PERMISSION_DENIED` (body includes `missing: [keys]`). The
      service layer re-checks with `assertAdminPermission` inside its
      transaction.
    - **Step-up.** `payout.execute` and `agent.pii.reveal` are *sensitive*
      permissions (so are `member.pii.reveal`, `refund.approve` and
      `rbac.manage`, not used here). A route that needs one also needs an authenticator check
      made **within the last 10 minutes** (`ADMIN_STEP_UP_MS`). If it is
      missing or stale the answer is **`401 ADMIN_STEP_UP_REQUIRED`** (not
      403: it means "authenticate again", not "not allowed"). The client calls
      `POST /admin/auth/step-up { code }` and retries. The permission check
      runs first, so a caller without the key gets 403, never the step-up
      prompt.
    - **Errors** keep Nest's shape `{ statusCode, error, code, message }` plus
      route-specific extras (for example `missing`, `agentStatus`, `reasons`).
      Branch on `code`, never on `message`.
    - **How to read a 401.** A 401 **with no `code`** means the caller is not
      signed in (the Firebase token is missing, invalid or expired; this comes
      from `FirebaseAuthGuard`, which adds no code). A 401 **with an
      `ADMIN_SESSION_*` or `ADMIN_STEP_UP_REQUIRED` code** is an admin session
      or step-up problem: start or renew the session with
      `POST /admin/auth/session`, or confirm with `POST /admin/auth/step-up`.
      There is no `UNAUTHORIZED` code.
    - **Where the error codes come from.** Only `VALIDATION_FAILED` is global
      (Shaaz's shared `validationFailed` exception factory in `@app/common`,
      wired into the global `ValidationPipe`). The not-found and state codes
      (`AGENT_NOT_FOUND`, `COMMISSION_NOT_FOUND`, `PAYOUT_NOT_FOUND`,
      `REFERRAL_NOT_FOUND`, `AGENT_TRANSITION_NOT_ALLOWED`, ...) are thrown by
      the agent code itself, with the same body shape as the admin errors, for
      example `new NotFoundException({ statusCode: 404, error: 'Not Found',
      code: 'AGENT_NOT_FOUND', message })`. The 403 for a missing permission
      (guard and service-level check) is handled on Shaaz's side.
    - **Path ids.** Every `{id}` path parameter is a UUID and must be read with
      `ParseUUIDPipe` using `exceptionFactory: validationFailed` from
      `@app/common` (available once Shaaz's PR with it is merged), so a
      malformed id answers `400 VALIDATION_FAILED` and not Nest's default
      `400` without a code.
    - **Lists** are cursor-paginated: `?cursor=&limit=` ->
      `{ items, nextCursor }` (`nextCursor` is `null` on the last page). `limit`
      is 1 to 100, default 25, as in the membership admin API. The cursor is
      opaque.
    - **Money** is integer **paise**. **Dates** are ISO-8601: timestamps in UTC
      (`2026-10-28T09:30:00Z`); plain calendar dates (`YYYY-MM-DD`, Indian
      time) only where noted.
    - **Every mutation** takes `{ reason }` (a string of 3 to 500 characters,
      `AdminReasonDto`) and writes its audit row **in the same transaction** as
      the change (`AdminAuditService.record(tx, ...)`, `actorType: STAFF`,
      `action` as named on each operation, `before` and `after` snapshots, the
      `reason`, the request context). If the audit write fails the change rolls
      back. Reads write no audit row, except `reveal`, which does and fails
      closed.
    - Routes are unversioned, as the other admin routes are (no
      `Accept-Version`).
    - **Settings are not constants.** The minimum payout, the wait after a
      payout-details change and the hold are settings; nothing below hard-codes
      a value.

    **What an admin may and may not see.** Admin responses show the *masked*
    phone, PAN last 4, *masked* payout details (`display`), status history,
    codes and counts. They **never** contain a sealed value, a full phone
    number, a full PAN, or full bank/UPI details. There are exactly two doors
    to full values:

    1. `POST /admin/agents/{id}/reveal` (`agent.pii.reveal`, step-up, `fields`
       of `PAN`, `PAYOUT_DETAILS`, `PHONE`, each audited, once, never cached).
       **Super Admin only.** It is the only way to see a PAN or a phone.
    2. **The payout destination, for the person who pays** (Final Build Spec
       §3 and §5). To pay, the payer needs the full UPI id or bank details, so
       `POST /admin/payouts` (create) and `GET /admin/payouts/{id}` (detail)
       include a `destination` **only for a caller who holds `payout.execute`
       and has a fresh step-up**. It is audited (an audit row in the same
       transaction as the read, failing closed), sent with
       `Cache-Control: no-store`, and **never** appears in a list response
       (`GET /admin/payouts`, `GET /admin/payouts/payable`), in `mark-paid` or
       `cancel` responses, or for anyone without `payout.execute`. It never
       contains a PAN or a phone number; the PAN stays behind `reveal`.

    The agent's own view (`GET /agent/me`, referrals,
    commissions) is a separate contract and stays separate: the agent never
    sees internal statuses, other agents, review flags or admin reasons
    (except the rejection reason, see `reject`).

    **Roles and permissions** (decided by Raja on 28 Oct; seeded by Shaaz
    together with the #129 migrations, with the 48 permission keys)

    | Role | Who | Permissions |
    |---|---|---|
    | `SUPER_ADMIN` | Raja plus one more person | All 48 permissions |
    | `PARTNER_MANAGER` | Staff who approve agents | `agent.view`, `agent.approve` |
    | `PAYOUT_MANAGER` | Raja and the person who pays | `payout.view`, `payout.execute` (step-up) |

    **Super Admin only, for now:** `agent.manage` (pause, resume, terminate,
    replace code), `agent.payout_details.verify` (payout details and PAN
    verification), `agent.pii.reveal` (the `reveal` route), every
    `attribution.*` key (referrals list and correct) and every `commission.*`
    key (list, approve, cancel, override). No other role is given any of them
    until Raja decides. Note that `PARTNER_MANAGER` and `PAYOUT_MANAGER` do not
    include `agent.view` (payout manager) or `payout.*` (partner manager), so
    each sees only what its table row lists. Because `payout.execute` can show
    a full payout destination, it must be granted only to the people who pay.

    **Agent state machine** (`canTransitionAgentStatus`, `agent-status.ts`):

    | From | Allowed next |
    |---|---|
    | `PENDING_APPROVAL` | `ACTIVE` (approve), `REJECTED` (reject) |
    | `ACTIVE` | `SUSPENDED` (pause), `TERMINATED` (terminate) |
    | `SUSPENDED` | `ACTIVE` (resume), `TERMINATED` (terminate) |
    | `REJECTED` | `PENDING_APPROVAL` - done by the *applicant* re-applying, never by an admin endpoint (while `REJECTED_MAY_REAPPLY` is true) |
    | `TERMINATED` | none (final) |

    A refused transition is `409 AGENT_TRANSITION_NOT_ALLOWED` with
    `agentStatus` (the current status) and `refusal` (`SAME_STATUS`,
    `TERMINATED_IS_FINAL` or `TRANSITION_NOT_ALLOWED`).

    **Commission statuses.** Admins see the *internal* status
    (`CommissionStatus`); the agent sees only the *public* one
    (`PublicCommissionStatus`). Every admin commission carries both, so the
    panel can show what the agent is seeing.

    | Internal (admin) | Public (agent) |
    |---|---|
    | `ON_HOLD`, `AWAITING_VERIFICATION`, `IN_REVIEW`, `FROZEN`, `READY` | `ON_HOLD` |
    | `APPROVED` | `APPROVED` |
    | `PAID` | `PAID` |
    | `CANCELLED`, `REVERSED` | `CANCELLED` |

    **What Shaaz still owns (not part of the agent work).**
    - The shared **`validationFailed` exception factory** in `@app/common`
      (his Thursday PR), which gives `VALIDATION_FAILED` to validation errors
      and, through `ParseUUIDPipe`, to a malformed `{id}`. It is the only
      error code that is global; the not-found codes are ours (the agent code
      throws its own) and the service-level 403 code is handled, so neither is
      open any more.
    - **Seeding the roles below** (see "Roles and permissions"). Until Shaaz
      renames his #129 migrations, seeds them and applies the pending
      migrations to production, only `SUPER_ADMIN` exists.
    - The settings table and service, the OTP/identifier-hash pieces, and the
      payment fields that `quoteReferral` and commissions depend on.

    **"Not yet implementable".** Operations marked so in their description
    depend on tables or pieces that do not exist: the commission and payout
    tables (the commission batch has not been built; `AgentCommissionPolicyPort`
    has no table), `PlatformSetting` and the 18-key settings seed (a separate
    migration that must sort after Shaaz's settings table), and the agent
    tables themselves, which exist only in the unapplied Phase 1 migration
    (PR #116). The `x-readiness` extension on each operation says which:
    `after-phase1-migration` (agent tables only), `after-settings-seed`, or
    `not-yet-implementable` (needs commission and/or payout tables).
  contact:
    name: Backend (agent program)

servers:
  - url: https://api.example.invalid
    description: Placeholder; use the Render service URL. Local - http://127.0.0.1:3000

tags:
  - name: Admin agents
  - name: Admin referrals
  - name: Admin commissions
  - name: Admin payouts

security:
  - firebaseIdToken: []
    adminSession: []

paths:
  /admin/agents/summary:
    get:
      tags: [Admin agents]
      summary: Counts for the agent-program overview
      operationId: adminAgentsSummary
      x-permission: agent.view
      x-readiness: after-phase1-migration
      description: |
        Counts only. Must be routed before `/admin/agents/{id}` so `summary` is
        not read as an id. `commissionsReady` and `payoutsCreated` are `null`
        until the commission and payout tables exist (**Not yet
        implementable** for those two fields).
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentsSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/agents:
    get:
      tags: [Admin agents]
      summary: List agents
      operationId: adminAgentsList
      x-permission: agent.view
      x-readiness: after-phase1-migration
      description: |
        Newest first. `q` is an exact match on an agent id, a referral code or
        a full phone number in E.164 (the phone is hashed server-side; the
        phone is never echoed back unmasked). `name` is a separate, case-
        insensitive **prefix** match on the agent's name. When both are given
        both must match. There is no partial-phone search.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AgentStatus' }
        - name: q
          in: query
          description: Exact agent id, referral code (`NM...`) or E.164 phone.
          schema: { type: string, maxLength: 64 }
        - name: name
          in: query
          description: Case-insensitive prefix of the agent's name (at least 2 characters).
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: payoutDetails
          in: query
          description: '`UNVERIFIED` lists agents whose payout details are set but not verified.'
          schema: { type: string, enum: [UNVERIFIED] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of agents.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminAgentListItem' }
                  nextCursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/agents/{id}:
    get:
      tags: [Admin agents]
      summary: One agent
      operationId: adminAgentGet
      x-permission: agent.view
      x-readiness: after-phase1-migration
      description: |
        Masked phone, PAN last 4, masked payout details, codes, counts and the
        status history. The history is read from the audit log, but **only
        this agent's status-change entries** (`entity` `Agent`, this id,
        actions `agent.approve`, `agent.reject`, `agent.pause`, `agent.resume`,
        `agent.terminate`) are exposed, so `agent.view` does not grant
        `audit.view`. Never a sealed value. `commissions` is `null` until the
        commission tables exist (**Not yet implementable** for that field).
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAgentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }

  /admin/agents/{id}/approve:
    post:
      tags: [Admin agents]
      summary: Approve an application
      operationId: adminAgentApprove
      x-permission: agent.approve
      x-readiness: after-phase1-migration
      x-audit-action: agent.approve
      description: |
        **Allowed only from `PENDING_APPROVAL`** -> `ACTIVE`. In one
        transaction: set `status` and `approvedAt`, clear `rejectionReason`,
        create the agent's first (primary, active) referral code, write the
        audit row. Everything else (including a second approve) is
        `409 AGENT_TRANSITION_NOT_ALLOWED`.

        `reason` is internal (audit only); the agent is not shown it.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: The agent after approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAgentDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentTransitionNotAllowed' }

  /admin/agents/{id}/reject:
    post:
      tags: [Admin agents]
      summary: Reject an application
      operationId: adminAgentReject
      x-permission: agent.approve
      x-readiness: after-phase1-migration
      x-audit-action: agent.reject
      description: |
        **Allowed only from `PENDING_APPROVAL`** -> `REJECTED`.

        **There is one reason, and it is shown to the applicant** as
        `rejectionReason` in `GET /agent/me` (and kept on the audit row), so it
        must be written for them. The panel must say so next to the field.
        There is no separate internal note.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: The agent after rejection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAgentDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentTransitionNotAllowed' }

  /admin/agents/{id}/pause:
    post:
      tags: [Admin agents]
      summary: Pause an agent
      operationId: adminAgentPause
      x-permission: agent.manage
      x-readiness: after-phase1-migration
      x-audit-action: agent.pause
      description: |
        **Allowed only from `ACTIVE`** -> `SUSPENDED` (shown to the agent as
        "Paused"). Effect: new referrals are no longer credited, links stop
        being shareable, payout-details edits are blocked. Codes stay
        recorded. Open commissions move to `FROZEN` by the daily job (not
        inside this request). Reversible with `resume`.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: The agent after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAgentDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentTransitionNotAllowed' }

  /admin/agents/{id}/resume:
    post:
      tags: [Admin agents]
      summary: Resume a paused agent
      operationId: adminAgentResume
      x-permission: agent.manage
      x-readiness: after-phase1-migration
      x-audit-action: agent.resume
      description: |
        **Allowed only from `SUSPENDED`** -> `ACTIVE`. Not a way to undo
        `TERMINATED` (final) or `REJECTED`. Frozen commissions are evaluated
        again by the daily job.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: The agent after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAgentDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentTransitionNotAllowed' }

  /admin/agents/{id}/terminate:
    post:
      tags: [Admin agents]
      summary: Terminate an agent (final)
      operationId: adminAgentTerminate
      x-permission: agent.manage
      x-readiness: after-phase1-migration
      x-audit-action: agent.terminate
      description: |
        **Allowed from `ACTIVE` or `SUSPENDED`** -> `TERMINATED`, which is
        **final**. The agent keeps read-only access (status, commissions,
        balance, payouts). No new credit, no sharing, no payout-details edits.
        Already-approved commissions remain payable (`decidePayoutEligibility`
        treats `TERMINATED` as payable); open commissions are frozen, which is
        a **pending decision (Raja)** in `frozenForAgent()`.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: The agent after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAgentDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentTransitionNotAllowed' }

  /admin/agents/{id}/codes/replace:
    post:
      tags: [Admin agents]
      summary: Issue a new primary referral code
      operationId: adminAgentCodesReplace
      x-permission: agent.manage
      x-readiness: after-phase1-migration
      x-audit-action: agent.code.replace
      description: |
        **Allowed when the agent is `ACTIVE` or `SUSPENDED`** (an agent has a
        code only after approval; a terminated agent's codes are not
        replaced). In one transaction a new code is generated and becomes
        `isPrimary`; the old primary becomes `isPrimary: false` but stays
        `isActive: true`, so **old codes keep working** and keep attributing
        members (while the agent can earn). Nothing is deleted. The
        one-primary-per-agent index is respected by demoting before
        promoting.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: The agent's codes after the change.
          content:
            application/json:
              schema:
                type: object
                required: [primary, codes]
                properties:
                  primary: { $ref: '#/components/schemas/AdminReferralCode' }
                  codes:
                    type: array
                    items: { $ref: '#/components/schemas/AdminReferralCode' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentStatusNotAllowed' }

  /admin/agents/{id}/payout-details/verify:
    post:
      tags: [Admin agents]
      summary: Mark the agent's payout details as verified
      operationId: adminAgentPayoutDetailsVerify
      x-permission: agent.payout_details.verify
      x-readiness: after-phase1-migration
      x-audit-action: agent.payout_details.verify
      description: |
        Sets `verifiedAt` on the agent's current payout details. Requires that
        details exist (`payoutDetailsSet`) and are not already verified.
        **Allowed when the agent is `ACTIVE`, `SUSPENDED` or `TERMINATED`**
        (details can only have been set while `ACTIVE`; a terminated agent may
        still be owed money). Not allowed for `PENDING_APPROVAL` or
        `REJECTED`.

        Any later change by the agent clears `verifiedAt` and restarts the
        wait (`agent.payout_details_wait_hours`), so verify the *current*
        details; the response includes `changedAt`. Verifying does not end the
        wait. Payout creation checks both. To see the full details before
        verifying, use `reveal` with `PAYOUT_DETAILS`. This does not verify
        the PAN (see `pan/verify`).
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: The agent after verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAgentDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409':
          description: |
            `AGENT_STATUS_NOT_ALLOWED` (with `agentStatus`),
            `PAYOUT_DETAILS_NOT_SET` or `PAYOUT_DETAILS_ALREADY_VERIFIED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/agents/{id}/reveal:
    post:
      tags: [Admin agents]
      summary: Reveal the agent's PAN, payout details and/or phone, once
      operationId: adminAgentReveal
      x-permission: agent.pii.reveal
      x-step-up: true
      x-readiness: after-phase1-migration
      x-audit-action: agent.pii.reveal
      description: |
        Returns the **requested** full values **in this response only**:
        `fields` lists what to reveal, at least one of `PAN`,
        `PAYOUT_DETAILS`, `PHONE`, no repeats. Only the requested fields
        appear in the answer. A POST, not a GET, so it is never cached,
        prefetched or replayed by a proxy. The response carries
        `Cache-Control: no-store`. The server does not keep or log the values;
        the panel must not store them. This is the only door to any full value;
        every other admin response is masked.

        **Reason required** (`AdminReasonDto`, 3 to 500 characters), the same
        for all fields in the request.

        **Step-up required:** `401 ADMIN_STEP_UP_REQUIRED` unless an
        authenticator check was made in the last 10 minutes. The permission is
        checked first (403 if the caller lacks `agent.pii.reveal`).

        **Each field is audited.** One audit row per revealed field
        (`agent.pii.reveal`, `reason`, `metadata.field` = `PAN`,
        `PAYOUT_DETAILS` or `PHONE`, never the value) in the same transaction
        as the read. **It fails closed:** if any audit write fails, nothing is
        returned. If one requested field cannot be revealed (not on file) the
        whole request fails and **nothing is revealed or audited**.

        **Allowed in any agent status**, including `TERMINATED` (an agent may
        be owed a payout). `404 AGENT_NOT_FOUND`; `409 PAN_NOT_SET` or
        `409 PAYOUT_DETAILS_NOT_SET` when a requested value is not on file.
        `PHONE` is always on file.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields, reason]
              additionalProperties: false
              properties:
                fields:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/RevealField' }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
