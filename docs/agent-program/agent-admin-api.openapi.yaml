  /admin/referrals/{id}/correct:
    post:
      tags: [Admin referrals]
      summary: Correct a referral attribution
      operationId: adminReferralCorrect
      x-permission: attribution.override
      x-readiness: after-phase1-migration
      x-audit-action: attribution.correct
      description: |
        The correction is named by `action` (decided shape). This is the
        "admin can correct it with a recorded reason" path for a blocked
        self-referral and for `needsReview` rows.

        - `REASSIGN_AGENT` (requires `agentId`): credit a different agent.
          The target must be `ACTIVE`. Sets `source` to `ADMIN_SET`. The
          credit window end is **not** reset. Refused with `SELF_REFERRAL`
          when the target agent's phone is the member's phone.
        - `REJECT`: set `status` to `REJECTED` (not credited).
        - `CLEAR_REVIEW`: set `needsReview` to false, nothing else.

        **Allowed only while the attribution is `ACTIVE`, `EXPIRED` or
        `REJECTED`**; once `CONVERTED` a commission exists and must be handled
        with the commission endpoints (`409 ATTRIBUTION_CONVERTED`).
      parameters:
        - name: id
          in: path
          required: true
          description: The attribution id.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, action]
              additionalProperties: false
              properties:
                reason: { $ref: '#/components/schemas/Reason' }
                action:
                  type: string
                  enum: [REASSIGN_AGENT, REJECT, CLEAR_REVIEW]
                agentId:
                  type: string
                  format: uuid
                  description: Required for `REASSIGN_AGENT`, rejected otherwise.
      responses:
        '200':
          description: The attribution after the correction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReferral' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`REFERRAL_NOT_FOUND`, or `AGENT_NOT_FOUND` for the target agent.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`ATTRIBUTION_CONVERTED`, or `AGENT_STATUS_NOT_ALLOWED` when the target agent is not `ACTIVE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`SELF_REFERRAL`: the target agent is the member.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

