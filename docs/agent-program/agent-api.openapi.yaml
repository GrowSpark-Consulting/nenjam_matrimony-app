openapi: 3.0.3
info:
  title: Nenjam Agent / Partner Program API
  version: 0.1.0-draft
  description: |
    DRAFT contract for the agent-facing and referral-related member endpoints.
    Nothing here is implemented yet.

    **Scope.** Agent sign-in, application, profile, referral links, referred
    members, commissions, balance, payouts (read-only), push devices, plus the
    two member endpoints (validate a code, attach a code after sign-in).
    Agent-added clients ("Way 2") are deliberately left out and come later.

    **Two kinds of caller.**
    - *Agent*: signs in with phone + OTP and gets our own access token and a
      rotating refresh token in the response body. It is NOT a Firebase token
      and an agent is not a member. OTP is delivered/verified through the shared
      `OtpService` (owned by the payments/admin side) with purpose
      `AGENT_SIGN_IN`; we do not change OTP behaviour.
    - *Applicant*: a phone with no agent record yet. Signs in the same way but
      gets an access token ONLY (`scope: APPLICANT`, no refresh token). If it
      expires before they apply, the applicant verifies by OTP again. A
      successful `POST /agent/application` returns a full agent session (access
      plus refresh token), so no second OTP is needed after applying. Token
      lifetimes are settings, not constants.
    - *Member*: the existing Firebase ID token (`Authorization: Bearer ...`).

    **Conventions**
    - Money is always an integer number of **paise** (Rs. 500 = `50000`).
    - Dates the agent sees are calendar dates in Indian time (UTC+05:30),
      formatted `YYYY-MM-DD`. Timestamps are ISO-8601 UTC.
    - Lists use **cursor pagination**: `?cursor=&limit=` ->
      `{ items, nextCursor }`. `nextCursor` is `null` on the last page. The
      cursor is opaque; pass it back unchanged.
    - **Versioning.** Send `Accept-Version: 1` on every request. The API is
      unversioned today; the server treats a missing header as `1` and an
      unsupported value as `406 UNSUPPORTED_VERSION`. Responses echo
      `Content-Version`.
    - **Errors** keep Nest's existing shape `{ statusCode, message, error }`
      and add one field, a stable machine-readable `code`. We do not introduce
      a new envelope because the live Flutter app already parses the current
      shape; the added `code` is additive and safe for it to ignore. New
      clients branch on `code`, never on `message`.
    - **Any agent or member referral route may also answer:** `503
      AGENT_PROGRAM_UNAVAILABLE` while the agent program is not fully set up
      on the server (token secret, sealing key, a setting or the commission
      policy missing; show "not available yet", retry later); `503
      IDENTIFIER_HASHING_UNAVAILABLE` or `503 OTP_DELIVERY_UNAVAILABLE`
      from the shared platform services; and `409 CONCURRENT_CHANGE` when
      two requests changed the same thing at once (retry). With
      `AGENT_PROGRAM_ENABLED` off on the server the routes do not exist (404).
    - **Settings are not constants.** Hold days, credit window, minimum payout,
      referred-member discount and commission rate are settings; clients read
      the ones they display from `GET /agent/config`.

    **Agent account states and what they may call**

    | Status | Sign-in | Allowed |
    |---|---|---|
    | (no agent yet) | yes, `scope: APPLICANT`, **access token only** (no refresh; verify by OTP again if it expires before applying) | `POST /agent/application` (returns an agent session), `GET /agent/me` (404) |
    | `PENDING_APPROVAL` | yes | `GET /agent/me`, `GET /agent/config`, refresh, logout |
    | `REJECTED` | yes | as above; `rejectionReason` is returned; may re-apply |
    | `ACTIVE` | yes | everything |
    | `SUSPENDED` (shown as "Paused") | yes | all reads; new referrals are not credited; payout-details edits blocked |
    | `TERMINATED` | yes, **read-only** | `GET /agent/me` (status), `GET /agent/config`, `GET /agent/commissions`, `GET /agent/balance`, `GET /agent/payouts`, refresh, logout. No new credit, cannot add members, no referral links, no payout-details edits. Approved balance is still paid. |

    Calls not allowed in the caller's state get `403 AGENT_NOT_ACTIVE`.
  contact:
    name: Backend (agent program)

servers:
  - url: https://api.example.invalid
    description: Placeholder; use the Render service URL. Local - http://127.0.0.1:3000

tags:
  - name: Agent auth
  - name: Agent
  - name: Referrals
  - name: Money
  - name: Member

paths:
  /agent/auth/otp/request:
    post:
      tags: [Agent auth]
      summary: Send a sign-in OTP to an agent's phone
      description: |
        Starts sign-in or application. Same response whether or not the phone
        already belongs to an agent, so the endpoint cannot be used to find out
        who is an agent. Delegates to `OtpService` with purpose
        `AGENT_SIGN_IN`. Rate limited per IP and per phone.

        The response carries a `challengeId`: an opaque id for this one OTP.
        Keep it and send it, with the code, to `POST /agent/auth/otp/verify`.
        The phone is not sent again; it comes from the verified challenge. A
        new request for the same phone returns a new `challengeId` and the
        earlier one should be dropped.
      operationId: agentOtpRequest
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              additionalProperties: false
              properties:
                phone:
                  $ref: '#/components/schemas/PhoneE164'
      responses:
        '200':
          description: OTP sent (or, with the dummy OTP, accepted).
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, expiresInSeconds, resendAfterSeconds]
                properties:
                  challengeId:
                    type: string
                    description: Opaque id of this OTP. Send it to `POST /agent/auth/otp/verify`.
                    example: 6f1d2c3a-8b4e-4f7a-9d10-5e2b7c9a1f34
                  expiresInSeconds: { type: integer, example: 300 }
                  resendAfterSeconds: { type: integer, example: 30 }
              example:
                challengeId: 6f1d2c3a-8b4e-4f7a-9d10-5e2b7c9a1f34
                expiresInSeconds: 300
                resendAfterSeconds: 30
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /agent/auth/otp/verify:
    post:
      tags: [Agent auth]
      summary: Verify the OTP and get our own agent tokens
      description: |
        Send the `challengeId` from `POST /agent/auth/otp/request` and the
        code. The phone is not sent: it is taken from the verified challenge.
        A challenge that does not exist, or was created for another purpose,
        is reported as `OTP_INVALID`, so nothing about it is revealed.

        Tokens are returned **in the body**. What comes back depends on whether
        the phone already has an agent record:

        - **Existing agent, in any status** (`PENDING_APPROVAL`, `REJECTED`,
          `ACTIVE`, `SUSPENDED`, `TERMINATED`): an `AgentSession` with an
          access token **and** a rotating refresh token, `scope: AGENT`.
          A `TERMINATED` agent signs in read-only (see the state table).
        - **Applicant** (no agent record yet): an `ApplicantSession` with an
          access token **only**, `scope: APPLICANT`, and its expiry. There is
          no refresh token, so `POST /agent/auth/refresh` cannot extend it.
          The token only allows `POST /agent/application` and `GET /agent/me`
          (404). If it expires before applying, the applicant verifies by OTP
          again. A successful `POST /agent/application` returns a full
          `AgentSession`, so no second OTP is needed after applying.

        Branch on `scope`. Access and refresh token lifetimes are settings,
        not constants; `expiresInSeconds` reports the access token's.
      operationId: agentOtpVerify
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              additionalProperties: false
              properties:
                challengeId:
                  type: string
                  description: The `challengeId` returned by `POST /agent/auth/otp/request`.
                  example: 6f1d2c3a-8b4e-4f7a-9d10-5e2b7c9a1f34
                code:
                  type: string
                  pattern: '^[0-9]{4,8}$'
                  example: '123456'
      responses:
        '200':
          description: Signed in. An `AgentSession` for an existing agent, an `ApplicantSession` otherwise.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AgentSession'
                  - $ref: '#/components/schemas/ApplicantSession'
                discriminator:
                  propertyName: scope
                  mapping:
                    AGENT: '#/components/schemas/AgentSession'
                    APPLICANT: '#/components/schemas/ApplicantSession'
              examples:
                agent:
                  summary: Existing agent (any status)
                  value:
                    accessToken: '<agent access token>'
                    refreshToken: '<opaque refresh token>'
                    expiresInSeconds: 900
                    scope: AGENT
                    agent:
                      id: 3f1c2b9e-0d5a-4e7b-9c1a-2b6d8e4f7a10
                      name: Ravi Kumar
                      phoneMasked: '+91 98***210'
                      city: Coimbatore
                      state: Tamil Nadu
                      status: PENDING_APPROVAL
                      statusLabel: { en: Under review, ta: '<to be supplied>' }
                      rejectionReason: null
                      approvedAt: null
                      panLast4: null
                      payoutDetailsSet: false
                      primaryCode: null
                applicant:
                  summary: Applicant (no agent record yet)
                  value:
                    accessToken: '<applicant access token>'
                    expiresInSeconds: 900
                    scope: APPLICANT
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: |
            OTP wrong, already used, unknown challenge or wrong purpose
            (`OTP_INVALID`), or expired (`OTP_EXPIRED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /agent/auth/refresh:
    post:
      tags: [Agent auth]
      summary: Exchange a refresh token for a new token pair
      description: |
        Refresh tokens rotate: each use returns a new pair and invalidates the
        old refresh token. Presenting an already-used (revoked) refresh token
        is treated as theft or a replay: it revokes **every** refresh token of
        that agent, on every device, and answers `REFRESH_TOKEN_REUSED`; the
        agent must sign in again.

        **Clients must serialise refresh calls.** Two calls with the same
        refresh token at the same time count as reuse: one succeeds, the other
        gets `REFRESH_TOKEN_REUSED`, and the success is revoked as well, so
        the agent is signed out everywhere. Keep one refresh in flight per
        session, including across browser tabs and windows sharing the same
        stored token (for example a lock shared by all tabs), and have the
        others wait and use the new token.

        Agent sessions only: applicants have no refresh token and verify by OTP
        again when their access token expires. The refresh token lifetime is a
        setting.
      operationId: agentRefresh
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: '`REFRESH_TOKEN_INVALID`, `REFRESH_TOKEN_EXPIRED` or `REFRESH_TOKEN_REUSED`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agent/auth/logout:
    post:
      tags: [Agent auth]
      summary: Revoke this session's refresh token
      description: |
        Revokes the given refresh token only; the agent's other sessions stay
        signed in. It must belong to the signed-in agent; anyone else's token
        is ignored. Presenting the revoked token to `POST /agent/auth/refresh`
        later counts as reuse (see there). Optionally deactivates this device's
        push token. Idempotent: an unknown or already-revoked token still
        returns 204. Agent sessions only: an applicant has no
        refresh token and nothing to revoke, so the app simply discards the
        applicant access token.
      operationId: agentLogout
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string }
                fcmToken:
                  type: string
                  description: If given, this device stops receiving pushes.
      responses:
        '204': { description: Signed out. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agent/application:
    post:
      tags: [Agent]
      summary: Apply to become an agent
      description: |
        Needs an `APPLICANT` or `REJECTED` session. Creates the agent as
        `PENDING_APPROVAL` (a `REJECTED` agent re-applying goes back to
        `PENDING_APPROVAL` and the old `rejectionReason` is cleared). The phone
        is the verified sign-in phone; it is never taken from the body.

        **On success it returns an `AgentSession`** for the agent record just
        created (`CREATE_PENDING`) or resubmitted (`RESUBMIT_PENDING`): an
        access token plus a rotating refresh token, `scope: AGENT`, and the
        agent's profile in `agent` (status `PENDING_APPROVAL`). The app stores
        these tokens in place of the ones it used to call this endpoint, so no
        second OTP is needed. An applicant's old access token is not upgraded;
        it simply stops being used. When a `REJECTED` agent resubmits, the new
        session starts a new refresh token family and the previous family is
        revoked. Token lifetimes are settings.

        **PAN is optional on the application, but it is required, together
        with verified payout details, before the first payout can be created.**
        Until both are on file an admin cannot create that agent's first
        payout (the admin side shows what is missing); commission still
        accrues meanwhile. Payout details are added later through
        `PATCH /agent/me/payout-details`.
      operationId: agentApply
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, city, state]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 100, example: Ravi Kumar }
                city: { type: string, minLength: 1, maxLength: 80, example: Coimbatore }
                state: { type: string, minLength: 1, maxLength: 80, example: Tamil Nadu }
                pan:
                  type: string
                  pattern: '^[A-Z]{5}[0-9]{4}[A-Z]$'
                  example: ABCDE1234F
                  description: Optional. Stored encrypted; only the last 4 are ever shown.
      responses:
        '201':
          description: |
            Application received. Returns an agent session (access plus
            refresh token) for the new or resubmitted agent; `agent` is its
            profile, now `PENDING_APPROVAL`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
              examples:
                created:
                  summary: New application (CREATE_PENDING)
                  value:
                    accessToken: '<agent access token>'
                    refreshToken: '<opaque refresh token>'
                    expiresInSeconds: 900
                    scope: AGENT
                    agent:
                      id: 3f1c2b9e-0d5a-4e7b-9c1a-2b6d8e4f7a10
                      name: Ravi Kumar
                      phoneMasked: '+91 98***210'
                      city: Coimbatore
                      state: Tamil Nadu
                      status: PENDING_APPROVAL
                      statusLabel: { en: Under review, ta: '<to be supplied>' }
                      rejectionReason: null
                      approvedAt: null
                      panLast4: '234F'
                      payoutDetailsSet: false
                      primaryCode: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: |
            Missing, invalid or expired token (`UNAUTHORIZED`, `TOKEN_EXPIRED`), or
            the applicant's verified phone has expired or is gone
            (`UNAUTHORIZED`): the applicant verifies by OTP again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            A rejected agent may not apply again (`AGENT_NOT_ACTIVE`, with
            `agentStatus: REJECTED`). Only while re-applying is switched off.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            An application or agent already exists and the caller may not
            apply again (`APPLICATION_EXISTS`). `agentStatus` says which:
            `PENDING_APPROVAL` (already under review) or `ACTIVE`,
            `SUSPENDED`, `TERMINATED` (already an agent). It is **absent**
            when the phone already has an agent that this session does not
            belong to (for example it applied from another device): sign in
            again to see it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agent/me:
    get:
      tags: [Agent]
      summary: The signed-in agent's profile and status
      description: |
        Returns the status the app should render. For `REJECTED`,
        `rejectionReason` is set. `SUSPENDED` is labelled "Paused" via
        `statusLabel`. An `APPLICANT` session with no application gets
        `404 AGENT_NOT_FOUND`.
      operationId: agentMe
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No application yet (`AGENT_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agent/me/payout-details:
    patch:
      tags: [Agent]
      summary: Set or change where commission is paid
      description: |
        Needs `ACTIVE`. Exactly one of `upi` or `bank`. Stored encrypted. The
        response never echoes the full account number or UPI id. Agents cannot
        create payouts; this only says where an admin-created payout goes.
      operationId: agentUpdatePayoutDetails
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              maxProperties: 1
              properties:
                upi:
                  type: object
                  required: [vpa]
                  additionalProperties: false
                  properties:
                    vpa:
                      type: string
                      example: ravi@okbank
                bank:
                  type: object
                  required: [accountHolderName, accountNumber, ifsc]
                  additionalProperties: false
                  properties:
                    accountHolderName: { type: string, maxLength: 100 }
                    accountNumber: { type: string, pattern: '^[0-9]{9,18}$' }
                    ifsc: { type: string, pattern: '^[A-Z]{4}0[A-Z0-9]{6}$', example: HDFC0001234 }
      responses:
        '200':
          description: Saved. Masked summary only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDetailsSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AgentNotActive' }

  /agent/config:
    get:
      tags: [Agent]
      summary: Labels, stage names, share messages and displayed settings
      description: |
        One call the app makes after sign-in (and may cache). Everything the
        app would otherwise hard-code: display labels in English and Tamil, and
        the setting values it shows. Values are read from settings at request
        time, so they can change without an app release. Available to any
        agent in any status, including `PENDING_APPROVAL` and `TERMINATED`
        (the app needs the labels to show the status).
      operationId: agentConfig
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      responses:
        '200':
          description: Config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agent/referral-links:
    get:
      tags: [Referrals]
      summary: The agent's codes, links and QR payloads
      description: |
        Bounded list (an agent holds a handful of codes), so not paginated.
        Needs `ACTIVE`; a `SUSPENDED` agent gets the list with
        `shareable: false` on every item.

        The public web address is not decided yet, so `link` and `qrPayload`
        are **nullable** and are `null` until it is. The `code` and the
        `shareMessages` are **always** returned. While `link` is null the
        share messages are the code-only wording; once a link exists they
        include it. Clients must render the code (and a "copy code" action)
        whether or not a link is present, and hide QR when `qrPayload` is null.
      operationId: agentReferralLinks
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      responses:
        '200':
          description: Codes.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReferralLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AgentNotActive' }

  /agent/referrals:
    get:
      tags: [Referrals]
      summary: Members this agent referred
      description: |
        Newest first. Each item is the allow-listed `AgentReferralView` and
        nothing else: no email, photos, income, family, horoscope, full phone,
        user id or internal review state.
      operationId: agentReferralsList
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: stage
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ReferralStage' }
      responses:
        '200':
          description: A page.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AgentReferralView' }
                  nextCursor:
                    type: string
                    nullable: true
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AgentNotActive' }

  /agent/referrals/{id}:
    get:
      tags: [Referrals]
      summary: One referred member
      description: '`id` is the attribution id (the `id` in the list), never a user id.'
      operationId: agentReferralGet
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The referral.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentReferralView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AgentNotActive' }
        '404':
          description: Not found, or belongs to another agent (`REFERRAL_NOT_FOUND`). Both look identical.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agent/commissions:
    get:
      tags: [Money]
      summary: Commission entries
      description: Newest first. Statuses are the public set only.
      operationId: agentCommissionsList
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PublicCommissionStatus' }
      responses:
        '200':
          description: A page.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Commission' }
                  nextCursor:
                    type: string
                    nullable: true
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AgentNotActive' }

  /agent/balance:
    get:
      tags: [Money]
      summary: Totals by commission status, and payout eligibility
      description: |
        All amounts in paise. `availablePaise` is approved commission not yet
        paid out; `canRequestPayout` is informational (agents cannot create
        payouts; an admin does) and is true when `availablePaise` reaches
        `minPayoutPaise`.
      operationId: agentBalance
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      responses:
        '200':
          description: Balance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AgentNotActive' }

  /agent/payouts:
    get:
      tags: [Money]
      summary: Payout history (read-only)
      description: |
        Payouts are manual and created by an admin. There is no agent-side
        create, update or cancel. Also available to a `TERMINATED` agent.
      operationId: agentPayoutsList
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Payout' }
                  nextCursor:
                    type: string
                    nullable: true
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AgentNotActive' }

  /agent/devices:
    post:
      tags: [Agent]
      summary: Register this device for push notifications
      description: |
        Idempotent upsert on `fcmToken`: calling it again with a token that
        belongs to another agent moves it to this agent. Allowed for any
        agent except `TERMINATED`, so a pending applicant gets the approval push.
      operationId: agentRegisterDevice
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcmToken, platform]
              additionalProperties: false
              properties:
                fcmToken: { type: string, minLength: 20, maxLength: 4096 }
                platform:
                  type: string
                  enum: [ANDROID, IOS]
      responses:
        '204': { description: Registered. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /referrals/codes/validate:
    post:
      tags: [Member]
      summary: Check a referral code before sign-up
      description: |
        Called by the app while a person is typing a code, before they have an
        account, so **no token is needed**. Because it reveals an agent's first
        name and last initial it is attempt-limited **per IP and per code**.
        Exceeding either returns `429` with `Retry-After`. The limits are
        settings (suggested start: 10 requests / minute / IP and 5 distinct
        failed lookups / minute / IP; 20 lookups / hour / code).

        An unknown, inactive, malformed or not-ACTIVE-agent code all return the
        same `200 { valid: false, agentDisplayName: null }` so the response
        cannot be used to tell them apart. Only these two fields are returned.
      operationId: referralCodeValidate
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code:
                  $ref: '#/components/schemas/ReferralCodeInput'
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema:
                type: object
                required: [valid, agentDisplayName]
                properties:
                  valid: { type: boolean }
                  agentDisplayName:
                    type: string
                    nullable: true
                    description: 'First name and last initial, e.g. "Ravi K.". Null when `valid` is false.'
                    example: Ravi K.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /registration/referral-code:
    post:
      tags: [Member]
      summary: Attach a referral code after sign-in
      description: |
        Member endpoint (Firebase ID token). Credits the signed-in member to
        the code's agent when no attribution exists for their phone yet. The
        first attribution wins; it is never silently replaced. An agent cannot
        attribute their own phone: that is refused for good (an admin can
        correct it, with a recorded reason). Also attempt-limited, per member
        and per code.

        Every code that cannot be used (unknown, inactive, or its agent not
        `ACTIVE`) gives the same `404 CODE_NOT_FOUND`, so the response cannot
        be used to find out which. A phone that is already credited to any
        agent is `409 ALREADY_ATTRIBUTED`, the same as an already-attributed
        member.
      operationId: registrationReferralCodeAttach
      security:
        - memberBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code:
                  $ref: '#/components/schemas/ReferralCodeInput'
      responses:
        '200':
          description: Attached.
          content:
            application/json:
              schema:
                type: object
                required: [attached, agentDisplayName, windowEndsAt]
                properties:
                  attached: { type: boolean, example: true }
                  agentDisplayName: { type: string, example: Ravi K. }
                  windowEndsAt:
                    type: string
                    format: date
                    description: Last day the credit window covers (IST).
        '400':
          description: The text is not a well-formed referral code (`VALIDATION_FAILED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Code does not exist, is inactive, or its agent is not active (`CODE_NOT_FOUND`). All three look identical.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The member, or their phone, is already attributed (`ALREADY_ATTRIBUTED`). The first agent always stays.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            Not allowed for this member. Branch on `code`:

            | `code` | Meaning |
            |---|---|
            | `SELF_REFERRAL` | The code belongs to the member's own phone. Permanent. |
            | `ALREADY_PAID` | The member has already paid for a plan, so a code can no longer be attached. |
            | `PHONE_NOT_VERIFIED` | The member has no verified phone. Any code needs one: at sign-up, by link or QR, or at payment. |
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: Agent access token (our own, not Firebase)
      description: |
        Issued by `POST /agent/auth/otp/verify` (and renewed by
        `POST /agent/auth/refresh` for agent sessions), short-lived. Carries
        `scope: AGENT` or `scope: APPLICANT`.
    memberBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: The existing member token.

  parameters:
    AcceptVersion:
      name: Accept-Version
      in: header
      required: false
      description: API version. Defaults to `1` when missing.
      schema:
        type: string
        enum: ['1']
        default: '1'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page's `nextCursor`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    ValidationFailed:
      description: Body or query failed validation (`VALIDATION_FAILED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or expired token (`UNAUTHORIZED`, `TOKEN_EXPIRED`). On `TOKEN_EXPIRED` the agent app should refresh once and retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AgentNotActive:
      description: The agent's status does not allow this call (`AGENT_NOT_ACTIVE`). The body includes the current `agentStatus`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate or attempt limit hit (`RATE_LIMITED`).
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [statusCode, message, error, code]
      properties:
        statusCode: { type: integer, example: 403 }
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          description: Human readable; may be a list for validation errors. Not for branching.
        error: { type: string, example: Forbidden }
        code:
          type: string
          description: |
            Stable machine-readable code. The 503 codes are temporary (show
            "not available right now", retry later):
            `AGENT_PROGRAM_UNAVAILABLE` (the agent program is not fully set up
            on the server), `IDENTIFIER_HASHING_UNAVAILABLE` (the shared
            hashing of phones and codes is not configured on the server) and
            `OTP_DELIVERY_UNAVAILABLE` (no one-time code can be sent to this
            phone right now). `CONCURRENT_CHANGE` (409): two requests changed
            the same thing at once; retry.
          enum:
            - VALIDATION_FAILED
            - UNAUTHORIZED
            - TOKEN_EXPIRED
            - UNSUPPORTED_VERSION
            - RATE_LIMITED
            - OTP_INVALID
            - OTP_EXPIRED
            - REFRESH_TOKEN_INVALID
            - REFRESH_TOKEN_EXPIRED
            - REFRESH_TOKEN_REUSED
            - AGENT_NOT_ACTIVE
            - AGENT_NOT_FOUND
            - APPLICATION_EXISTS
            - REFERRAL_NOT_FOUND
            - CODE_NOT_FOUND
            - ALREADY_ATTRIBUTED
            - SELF_REFERRAL
            - ALREADY_PAID
            - PHONE_NOT_VERIFIED
            - AGENT_PROGRAM_UNAVAILABLE
            - IDENTIFIER_HASHING_UNAVAILABLE
            - OTP_DELIVERY_UNAVAILABLE
            - CONCURRENT_CHANGE
        agentStatus:
          allOf:
            - $ref: '#/components/schemas/AgentStatus'
          description: |
            The agent's current status. Present on `AGENT_NOT_ACTIVE`, and on
            the `APPLICATION_EXISTS` refusal of `POST /agent/application` when
            the caller has an agent record of their own.

    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      example: '+919876543210'

    ReferralCodeInput:
      type: string
      description: Case-insensitive on input; the server upper-cases and trims.
      pattern: '^[Nn][Mm][2-9A-HJKMNP-Za-hjkmnp-z]{6}$'
      example: NM7K2P9X

    AgentStatus:
      type: string
      enum: [PENDING_APPROVAL, ACTIVE, REJECTED, SUSPENDED, TERMINATED]
      description: '`SUSPENDED` is displayed as "Paused" (see `statusLabel`).'

    ReferralStage:
      type: string
      enum: [REGISTERED, PROFILE_COMPLETE, PURCHASED]

    PublicCommissionStatus:
      type: string
      enum: [ON_HOLD, APPROVED, PAID, CANCELLED]
      description: |
        The only commission states an agent sees. Internal review and fraud
        states are folded into `ON_HOLD`; `REVERSED` is shown as `CANCELLED`.

    PayoutStatus:
      type: string
      enum: [CREATED, PAID, CANCELLED]
      description: |
        Payouts are manual: an admin creates one (`CREATED`, shown as
        "Processing"), pays it outside the app, then marks it `PAID` or
        `CANCELLED`.

    AgentSession:
      type: object
      description: Session for a phone that has an agent record, in any status.
      required: [accessToken, refreshToken, expiresInSeconds, scope, agent]
      properties:
        accessToken: { type: string, description: Agent access token. }
        refreshToken: { type: string, description: 'Opaque, single use, rotates on every refresh. Lifetime is a setting.' }
        expiresInSeconds:
          type: integer
          description: Access token lifetime in seconds (a setting).
          example: 900
        scope:
          type: string
          enum: [AGENT]
        agent: { $ref: '#/components/schemas/AgentProfile' }

    ApplicantSession:
      type: object
      description: |
        Session for a phone with no agent record yet. Access token only: there
        is no refresh token, and it cannot be refreshed. When it expires the
        applicant verifies by OTP again.
      required: [accessToken, expiresInSeconds, scope]
      additionalProperties: false
      properties:
        accessToken: { type: string, description: Applicant access token. }
        expiresInSeconds:
          type: integer
          description: Access token lifetime in seconds (a setting).
          example: 900
        scope:
          type: string
          enum: [APPLICANT]

    AgentProfile:
      type: object
      required: [id, name, phoneMasked, city, state, status, statusLabel, rejectionReason, approvedAt, panLast4, payoutDetailsSet, primaryCode]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phoneMasked:
          type: string
          example: '+91 98***210'
        city: { type: string }
        state: { type: string }
        status: { $ref: '#/components/schemas/AgentStatus' }
        statusLabel:
          $ref: '#/components/schemas/LocalizedText'
        rejectionReason:
          type: string
          nullable: true
          description: Set only when `status` is `REJECTED`.
        approvedAt:
          type: string
          format: date
          nullable: true
        panLast4:
          type: string
          nullable: true
          example: '234F'
        payoutDetailsSet: { type: boolean }
        primaryCode:
          type: string
          nullable: true
          description: Null until approved.
          example: NM7K2P9X

    PayoutDetailsSummary:
      type: object
      required: [method, display]
      properties:
        method: { type: string, enum: [UPI, BANK] }
        display:
          type: string
          description: Masked, never the full value.
          example: 'HDFC ****6789'

    LocalizedText:
      type: object
      required: [en, ta]
      properties:
        en: { type: string }
        ta: { type: string }

    AgentConfig:
      type: object
      required: [statusLabels, stageLabels, commissionStatusLabels, payoutStatusLabels, shareMessages, settings]
      properties:
        statusLabels:
          type: object
          description: Keyed by `AgentStatus`.
          additionalProperties: { $ref: '#/components/schemas/LocalizedText' }
          example:
            PENDING_APPROVAL: { en: Under review, ta: '<to be supplied>' }
            SUSPENDED: { en: Paused, ta: '<to be supplied>' }
        stageLabels:
          type: object
          description: Keyed by `ReferralStage`.
          additionalProperties: { $ref: '#/components/schemas/LocalizedText' }
        commissionStatusLabels:
          type: object
          description: Keyed by `PublicCommissionStatus`.
          additionalProperties: { $ref: '#/components/schemas/LocalizedText' }
        payoutStatusLabels:
          type: object
          description: Keyed by `PayoutStatus`. `CREATED` is displayed as "Processing".
          additionalProperties: { $ref: '#/components/schemas/LocalizedText' }
          example:
            CREATED: { en: Processing, ta: '<to be supplied>' }
            PAID: { en: Paid, ta: '<to be supplied>' }
            CANCELLED: { en: Cancelled, ta: '<to be supplied>' }
        shareMessages:
          type: array
          description: |
            The share-message templates, rendered by the backend. The wording
            (English and Tamil) is final (Raja, 28 Oct). Placeholders are
            `{agent_name}`, `{code}`, `{discount_percent}` (from the settings)
            and `{link}`; here `{discount_percent}` is already filled in. Each
            message ends with the link on its own line, which is omitted when
            there is no link. The client never types or fills in this text: to
            send a message, use the fully rendered `shareMessages` on each
            `ReferralLink`.
          items:
            type: object
            required: [id, text]
            properties:
              id: { type: string, example: default }
              text: { $ref: '#/components/schemas/LocalizedText' }
        settings:
          type: object
          required: [holdDays, creditWindowDays, minPayoutPaise, referredMemberDiscountPercent]
          properties:
            holdDays: { type: integer, example: 14 }
            creditWindowDays: { type: integer, example: 60 }
            minPayoutPaise: { type: integer, example: 50000 }
            referredMemberDiscountPercent: { type: integer, example: 5 }

    ReferralLink:
      type: object
      required: [codeId, code, isPrimary, link, qrPayload, shareMessages, shareable]
      properties:
        codeId: { type: string, format: uuid }
        code: { type: string, example: NM7K2P9X }
        isPrimary: { type: boolean }
        link:
          type: string
          format: uri
          nullable: true
          description: Null until the public web address is decided.
        qrPayload:
          type: string
          nullable: true
          description: The string to encode into a QR code (the same as `link`). Null whenever `link` is null.
        shareMessages:
          type: array
          description: |
            Ready-to-send texts for this code, rendered by the backend with
            `{agent_name}`, `{code}`, `{discount_percent}` (from the settings)
            and `{link}` already filled in. The wording (English and Tamil) is
            final (Raja, 28 Oct). The link line is omitted when there is no
            link. The client never types or fills in the text. Always present.
          items:
            type: object
            required: [id, text]
            properties:
              id: { type: string, example: default }
              text: { $ref: '#/components/schemas/LocalizedText' }
        shareable:
          type: boolean
          description: False while the agent is paused.

    AgentReferralView:
      type: object
      description: |
        The ONLY shape an agent sees about a referred member. Mirrors
        `agent-referral-view.ts`; the schema is closed.
      additionalProperties: false
      required: [id, displayName, age, city, signedUpAt, stage, profileCompletenessPct, planName, purchasedAt, commissionStatus, maskedPhone]
      properties:
        id:
          type: string
          description: The attribution id, never the user id.
        displayName:
          type: string
          description: First name and last initial.
          example: Priya S.
        age: { type: integer, example: 27 }
        city: { type: string, example: Chennai }
        signedUpAt:
          type: string
          format: date
          description: Date only, Indian time.
        stage: { $ref: '#/components/schemas/ReferralStage' }
        profileCompletenessPct: { type: integer, minimum: 0, maximum: 100 }
        planName: { type: string, nullable: true }
        purchasedAt:
          type: string
          format: date
          nullable: true
        commissionStatus:
          allOf:
            - $ref: '#/components/schemas/PublicCommissionStatus'
          nullable: true
        maskedPhone:
          type: string
          description: '+91, first 2 digits, ***, last 3. Fully masked if malformed.'
          example: '+91 98***210'

    Commission:
      type: object
      required: [id, referralId, referralDisplayName, planName, basePaise, amountPaise, rate, status, earnedOn, holdEndsOn, approvedOn, paidOn]
      properties:
        id: { type: string, format: uuid }
        referralId:
          type: string
          description: The attribution id (as in `AgentReferralView.id`).
        referralDisplayName: { type: string, example: Priya S. }
        planName: { type: string }
        basePaise:
          type: integer
          description: Amount the commission was calculated on (may exclude tax).
          example: 99900
        amountPaise:
          type: integer
          description: The commission itself, never above what the member paid.
          example: 9990
        rate:
          type: object
          description: The rule snapshotted when the commission was created.
          required: [calcType, value]
          properties:
            calcType: { type: string, enum: [PERCENTAGE] }
            value:
              type: integer
              description: Basis points for `PERCENTAGE` (1000 = 10%).
              example: 1000
        status: { $ref: '#/components/schemas/PublicCommissionStatus' }
        earnedOn: { type: string, format: date }
        holdEndsOn:
          type: string
          format: date
          nullable: true
        approvedOn:
          type: string
          format: date
          nullable: true
        paidOn:
          type: string
          format: date
          nullable: true

    Balance:
      type: object
      required: [onHoldPaise, availablePaise, paidPaise, minPayoutPaise, canRequestPayout]
      properties:
        onHoldPaise: { type: integer, example: 19980 }
        availablePaise: { type: integer, example: 60000 }
        paidPaise: { type: integer, example: 150000 }
        minPayoutPaise: { type: integer, example: 50000 }
        canRequestPayout:
          type: boolean
          description: Informational only; agents cannot create payouts.

    Payout:
      type: object
      required: [id, amountPaise, status, reference, createdOn, paidOn, commissionCount]
      properties:
        id: { type: string, format: uuid }
        amountPaise: { type: integer, example: 60000 }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        reference:
          type: string
          nullable: true
          description: Bank / UPI transaction reference once paid.
        createdOn: { type: string, format: date }
        paidOn:
          type: string
          format: date
          nullable: true
        commissionCount: { type: integer }
