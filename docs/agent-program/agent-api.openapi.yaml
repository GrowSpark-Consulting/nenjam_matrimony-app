openapi: 3.0.3
info:
  title: Nenjam Agent / Partner Program API
  version: 0.1.0-draft
  description: |
    DRAFT contract for the agent-facing and referral-related member endpoints.
    Nothing here is implemented yet.

    **Scope.** Agent sign-in, application, profile, referral links, referred
    members, commissions, balance, payouts (read-only), push devices, plus the
    two member endpoints (validate a code, attach a code after sign-in), and
    agent-added clients ("Way 2", below).

    **Agent-added clients ("Way 2").** An `ACTIVE` agent creates a DRAFT of a
    client's profile (the client's phone and her full profile: the member
    registration's sections and partner preferences, `ClientProfile`), may
    save it incomplete, edit or discard it, then SUBMITS it once the required
    fields are filled. Photos are not taken from agents (out of scope). From
    then on the draft is locked: the agent cannot change it. The client signs
    in with her phone and a one-time code (`/client-invites/*`), sees the
    profile and accepts or rejects it. Only on ACCEPT does a member account
    exist: it is hers, credited to the agent exactly as if she had used the
    agent's code (same commission, hold, credit window and first-plan
    discount). REJECT closes the draft, and that agent can never add that
    phone again. A draft not accepted in time expires (a setting). A phone
    that already belongs to a member cannot be added. The whole feature is
    behind its own switch (a setting, off by default); while the one-time
    code is the test (dummy) code, only the approved test numbers can be
    added or can receive a code.

    **Two kinds of caller.**
    - *Agent*: signs in with phone + OTP and gets our own access token and a
      rotating refresh token in the response body. It is NOT a Firebase token
      and an agent is not a member. OTP is delivered/verified through the shared
      `OtpService` (owned by the payments/admin side) with purpose
      `AGENT_SIGN_IN`; we do not change OTP behaviour.
    - *Applicant*: a phone with no agent record yet. Signs in the same way but
      gets an access token ONLY (`scope: APPLICANT`, no refresh token). If it
      expires before they apply, the applicant verifies by OTP again. A
      successful `POST /agent/application` returns a full agent session (access
      plus refresh token), so no second OTP is needed after applying. Token
      lifetimes are settings, not constants.
    - *Member*: the existing Firebase ID token (`Authorization: Bearer ...`).
    - *Client* (Way 2): a person an agent has added, before she is a member.
      Signs in with phone + one-time code (purpose `AGENT_CLIENT_CONSENT` of
      the same `OtpService`, so a client code never signs anyone in as an
      agent) and gets a short-lived **client token** (`scope: CLIENT`, access
      token only, no refresh). It is not an agent token and not a Firebase
      token: agent routes refuse it and client routes refuse an agent token.
      It only allows `GET /client-invites` and accepting or rejecting one of
      them. Accepting returns a Firebase custom token for the new member
      account.

    **Conventions**
    - Money is always an integer number of **paise** (Rs. 500 = `50000`).
    - Dates the agent sees are calendar dates in Indian time (UTC+05:30),
      formatted `YYYY-MM-DD`. Timestamps are ISO-8601 UTC.
    - Lists use **cursor pagination**: `?cursor=&limit=` ->
      `{ items, nextCursor }`. `nextCursor` is `null` on the last page. The
      cursor is opaque; pass it back unchanged.
    - **Versioning.** Send `Accept-Version: 1` on every request. The API is
      unversioned today; the server treats a missing header as `1` and an
      unsupported value as `406 UNSUPPORTED_VERSION`. Responses echo
      `Content-Version`.
    - **Errors** keep Nest's existing shape `{ statusCode, message, error }`
      and add one field, a stable machine-readable `code`. We do not introduce
      a new envelope because the live Flutter app already parses the current
      shape; the added `code` is additive and safe for it to ignore. New
      clients branch on `code`, never on `message`.
    - **Any agent or member referral route may also answer:** `503
      AGENT_PROGRAM_UNAVAILABLE` while the agent program is not fully set up
      on the server (token secret, sealing key, a setting or the commission
      policy missing; show "not available yet", retry later); `503
      IDENTIFIER_HASHING_UNAVAILABLE` or `503 OTP_DELIVERY_UNAVAILABLE`
      from the shared platform services; and `409 CONCURRENT_CHANGE` when
      two requests changed the same thing at once (retry). With
      `AGENT_PROGRAM_ENABLED` off on the server the routes do not exist (404).
    - **Settings are not constants.** Hold days, credit window, minimum payout,
      referred-member discount and commission rate are settings; clients read
      the ones they display from `GET /agent/config`.

    **Agent account states and what they may call**

    | Status | Sign-in | Allowed |
    |---|---|---|
    | (no agent yet) | yes, `scope: APPLICANT`, **access token only** (no refresh; verify by OTP again if it expires before applying) | `POST /agent/application` (returns an agent session), `GET /agent/me` (404) |
    | `PENDING_APPROVAL` | yes | `GET /agent/me`, `GET /agent/config`, refresh, logout |
    | `REJECTED` | yes | as above; `rejectionReason` is returned; may re-apply |
    | `ACTIVE` | yes | everything, including adding clients |
    | `SUSPENDED` (shown as "Paused") | yes | all reads, including `GET /agent/clients`; new referrals are not credited; payout-details edits blocked; cannot add, edit, discard or submit clients, and its waiting clients cannot accept until it is active again |
    | `TERMINATED` | yes, **read-only** | `GET /agent/me` (status), `GET /agent/config`, `GET /agent/commissions`, `GET /agent/balance`, `GET /agent/payouts`, refresh, logout. No new credit, cannot add members (no client routes), no referral links, no payout-details edits. Its open client drafts are closed. Approved balance is still paid. |

    Calls not allowed in the caller's state get `403 AGENT_NOT_ACTIVE`.
  contact:
    name: Backend (agent program)

servers:
  - url: https://api.example.invalid
    description: Placeholder; use the Render service URL. Local - http://127.0.0.1:3000

tags:
  - name: Agent auth
  - name: Agent
  - name: Referrals
  - name: Money
  - name: Member
  - name: Clients
  - name: Client invites

paths:
  /agent/auth/otp/request:
    post:
      tags: [Agent auth]
      summary: Send a sign-in OTP to an agent's phone
      description: |
        Starts sign-in or application. Same response whether or not the phone
        already belongs to an agent, so the endpoint cannot be used to find out
        who is an agent. Delegates to `OtpService` with purpose
        `AGENT_SIGN_IN`. Rate limited per IP and per phone.

        The response carries a `challengeId`: an opaque id for this one OTP.
        Keep it and send it, with the code, to `POST /agent/auth/otp/verify`.
        The phone is not sent again; it comes from the verified challenge. A
        new request for the same phone returns a new `challengeId` and the
        earlier one should be dropped.
      operationId: agentOtpRequest
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              additionalProperties: false
              properties:
                phone:
                  $ref: '#/components/schemas/PhoneE164'
      responses:
        '200':
          description: OTP sent (or, with the dummy OTP, accepted).
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, expiresInSeconds, resendAfterSeconds]
                properties:
                  challengeId:
                    type: string
                    description: Opaque id of this OTP. Send it to `POST /agent/auth/otp/verify`.
                    example: 6f1d2c3a-8b4e-4f7a-9d10-5e2b7c9a1f34
                  expiresInSeconds: { type: integer, example: 300 }
                  resendAfterSeconds: { type: integer, example: 30 }
              example:
                challengeId: 6f1d2c3a-8b4e-4f7a-9d10-5e2b7c9a1f34
                expiresInSeconds: 300
                resendAfterSeconds: 30
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /agent/auth/otp/verify:
    post:
      tags: [Agent auth]
      summary: Verify the OTP and get our own agent tokens
      description: |
        Send the `challengeId` from `POST /agent/auth/otp/request` and the
        code. The phone is not sent: it is taken from the verified challenge.
        A challenge that does not exist, or was created for another purpose,
        is reported as `OTP_INVALID`, so nothing about it is revealed.

        Tokens are returned **in the body**. What comes back depends on whether
        the phone already has an agent record:

        - **Existing agent, in any status** (`PENDING_APPROVAL`, `REJECTED`,
          `ACTIVE`, `SUSPENDED`, `TERMINATED`): an `AgentSession` with an
          access token **and** a rotating refresh token, `scope: AGENT`.
          A `TERMINATED` agent signs in read-only (see the state table).
        - **Applicant** (no agent record yet): an `ApplicantSession` with an
          access token **only**, `scope: APPLICANT`, and its expiry. There is
          no refresh token, so `POST /agent/auth/refresh` cannot extend it.
          The token only allows `POST /agent/application` and `GET /agent/me`
          (404). If it expires before applying, the applicant verifies by OTP
          again. A successful `POST /agent/application` returns a full
          `AgentSession`, so no second OTP is needed after applying.

        Branch on `scope`. Access and refresh token lifetimes are settings,
        not constants; `expiresInSeconds` reports the access token's.
      operationId: agentOtpVerify
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              additionalProperties: false
              properties:
                challengeId:
                  type: string
                  description: The `challengeId` returned by `POST /agent/auth/otp/request`.
                  example: 6f1d2c3a-8b4e-4f7a-9d10-5e2b7c9a1f34
                code:
                  type: string
                  pattern: '^[0-9]{4,8}$'
                  example: '123456'
      responses:
        '200':
          description: Signed in. An `AgentSession` for an existing agent, an `ApplicantSession` otherwise.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AgentSession'
                  - $ref: '#/components/schemas/ApplicantSession'
                discriminator:
                  propertyName: scope
                  mapping:
                    AGENT: '#/components/schemas/AgentSession'
                    APPLICANT: '#/components/schemas/ApplicantSession'
              examples:
                agent:
                  summary: Existing agent (any status)
                  value:
                    accessToken: '<agent access token>'
                    refreshToken: '<opaque refresh token>'
                    expiresInSeconds: 900
                    scope: AGENT
                    agent:
                      id: 3f1c2b9e-0d5a-4e7b-9c1a-2b6d8e4f7a10
                      name: Ravi Kumar
                      phoneMasked: '+91 98***210'
                      city: Coimbatore
                      state: Tamil Nadu
                      status: PENDING_APPROVAL
                      statusLabel: { en: Under review, ta: '<to be supplied>' }
                      rejectionReason: null
                      approvedAt: null
                      panLast4: null
                      payoutDetailsSet: false
                      primaryCode: null
                applicant:
                  summary: Applicant (no agent record yet)
                  value:
                    accessToken: '<applicant access token>'
                    expiresInSeconds: 900
                    scope: APPLICANT
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: |
            OTP wrong, already used, unknown challenge or wrong purpose
            (`OTP_INVALID`), or expired (`OTP_EXPIRED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /agent/auth/refresh:
    post:
      tags: [Agent auth]
      summary: Exchange a refresh token for a new token pair
      description: |
        Refresh tokens rotate: each use returns a new pair and invalidates the
        old refresh token. Presenting an already-used (revoked) refresh token
        is treated as theft or a replay: it revokes **every** refresh token of
        that agent, on every device, and answers `REFRESH_TOKEN_REUSED`; the
        agent must sign in again.

        **Clients must serialise refresh calls.** Two calls with the same
        refresh token at the same time count as reuse: one succeeds, the other
        gets `REFRESH_TOKEN_REUSED`, and the success is revoked as well, so
        the agent is signed out everywhere. Keep one refresh in flight per
        session, including across browser tabs and windows sharing the same
        stored token (for example a lock shared by all tabs), and have the
        others wait and use the new token.

        Agent sessions only: applicants have no refresh token and verify by OTP
        again when their access token expires. The refresh token lifetime is a
        setting.
      operationId: agentRefresh
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: '`REFRESH_TOKEN_INVALID`, `REFRESH_TOKEN_EXPIRED` or `REFRESH_TOKEN_REUSED`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agent/auth/logout:
    post:
      tags: [Agent auth]
      summary: Revoke this session's refresh token
      description: |
        Revokes the given refresh token only; the agent's other sessions stay
        signed in. It must belong to the signed-in agent; anyone else's token
        is ignored. Presenting the revoked token to `POST /agent/auth/refresh`
        later counts as reuse (see there). Optionally deactivates this device's
        push token. Idempotent: an unknown or already-revoked token still
        returns 204. Agent sessions only: an applicant has no
        refresh token and nothing to revoke, so the app simply discards the
        applicant access token.
      operationId: agentLogout
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string }
                fcmToken:
                  type: string
                  description: If given, this device stops receiving pushes.
      responses:
        '204': { description: Signed out. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agent/application:
    post:
      tags: [Agent]
      summary: Apply to become an agent
      description: |
        Needs an `APPLICANT` or `REJECTED` session. Creates the agent as
        `PENDING_APPROVAL` (a `REJECTED` agent re-applying goes back to
        `PENDING_APPROVAL` and the old `rejectionReason` is cleared). The phone
        is the verified sign-in phone; it is never taken from the body.

        **On success it returns an `AgentSession`** for the agent record just
        created (`CREATE_PENDING`) or resubmitted (`RESUBMIT_PENDING`): an
        access token plus a rotating refresh token, `scope: AGENT`, and the
        agent's profile in `agent` (status `PENDING_APPROVAL`). The app stores
        these tokens in place of the ones it used to call this endpoint, so no
        second OTP is needed. An applicant's old access token is not upgraded;
        it simply stops being used. When a `REJECTED` agent resubmits, the new
        session starts a new refresh token family and the previous family is
        revoked. Token lifetimes are settings.

        **PAN is optional on the application, but it is required, together
        with verified payout details, before the first payout can be created.**
        Until both are on file an admin cannot create that agent's first
        payout (the admin side shows what is missing); commission still
        accrues meanwhile. Payout details are added later through
        `PATCH /agent/me/payout-details`.
      operationId: agentApply
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, city, state]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 100, example: Ravi Kumar }
                city: { type: string, minLength: 1, maxLength: 80, example: Coimbatore }
                state: { type: string, minLength: 1, maxLength: 80, example: Tamil Nadu }
                pan:
                  type: string
                  pattern: '^[A-Z]{5}[0-9]{4}[A-Z]$'
                  example: ABCDE1234F
                  description: Optional. Stored encrypted; only the last 4 are ever shown.
      responses:
        '201':
          description: |
            Application received. Returns an agent session (access plus
            refresh token) for the new or resubmitted agent; `agent` is its
            profile, now `PENDING_APPROVAL`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
              examples:
                created:
                  summary: New application (CREATE_PENDING)
                  value:
                    accessToken: '<agent access token>'
                    refreshToken: '<opaque refresh token>'
                    expiresInSeconds: 900
                    scope: AGENT
                    agent:
                      id: 3f1c2b9e-0d5a-4e7b-9c1a-2b6d8e4f7a10
                      name: Ravi Kumar
                      phoneMasked: '+91 98***210'
                      city: Coimbatore
                      state: Tamil Nadu
                      status: PENDING_APPROVAL
                      statusLabel: { en: Under review, ta: '<to be supplied>' }
                      rejectionReason: null
                      approvedAt: null
                      panLast4: '234F'
                      payoutDetailsSet: false
                      primaryCode: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: |
            Missing, invalid or expired token (`UNAUTHORIZED`, `TOKEN_EXPIRED`), or
            the applicant's verified phone has expired or is gone
            (`UNAUTHORIZED`): the applicant verifies by OTP again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            A rejected agent may not apply again (`AGENT_NOT_ACTIVE`, with
            `agentStatus: REJECTED`). Only while re-applying is switched off.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            An application or agent already exists and the caller may not
            apply again (`APPLICATION_EXISTS`). `agentStatus` says which:
            `PENDING_APPROVAL` (already under review) or `ACTIVE`,
            `SUSPENDED`, `TERMINATED` (already an agent). It is **absent**
            when the phone already has an agent that this session does not
            belong to (for example it applied from another device): sign in
            again to see it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agent/me:
    get:
      tags: [Agent]
      summary: The signed-in agent's profile and status
      description: |
        Returns the status the app should render. For `REJECTED`,
        `rejectionReason` is set. `SUSPENDED` is labelled "Paused" via
        `statusLabel`. An `APPLICANT` session with no application gets
        `404 AGENT_NOT_FOUND`.
      operationId: agentMe
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No application yet (`AGENT_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agent/me/payout-details:
    patch:
      tags: [Agent]
      summary: Set or change where commission is paid
      description: |
        Needs `ACTIVE`. Exactly one of `upi` or `bank`. Stored encrypted. The
        response never echoes the full account number or UPI id. Agents cannot
        create payouts; this only says where an admin-created payout goes.
      operationId: agentUpdatePayoutDetails
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              maxProperties: 1
              properties:
                upi:
                  type: object
                  required: [vpa]
                  additionalProperties: false
                  properties:
                    vpa:
                      type: string
                      example: ravi@okbank
                bank:
                  type: object
                  required: [accountHolderName, accountNumber, ifsc]
                  additionalProperties: false
                  properties:
                    accountHolderName: { type: string, maxLength: 100 }
                    accountNumber: { type: string, pattern: '^[0-9]{9,18}$' }
                    ifsc: { type: string, pattern: '^[A-Z]{4}0[A-Z0-9]{6}$', example: HDFC0001234 }
      responses:
        '200':
          description: Saved. Masked summary only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDetailsSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AgentNotActive' }

  /agent/config:
    get:
      tags: [Agent]
      summary: Labels, stage names, share messages and displayed settings
      description: |
        One call the app makes after sign-in (and may cache). Everything the
        app would otherwise hard-code: display labels in English and Tamil, and
        the setting values it shows. Values are read from settings at request
        time, so they can change without an app release. Available to any
        agent in any status, including `PENDING_APPROVAL` and `TERMINATED`
        (the app needs the labels to show the status).
      operationId: agentConfig
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      responses:
        '200':
          description: Config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agent/referral-links:
    get:
      tags: [Referrals]
      summary: The agent's codes, links and QR payloads
      description: |
        Bounded list (an agent holds a handful of codes), so not paginated.
        Needs `ACTIVE`; a `SUSPENDED` agent gets the list with
        `shareable: false` on every item.

        `link` is `{base}/?ref={code}`: `base` is the platform setting
        `referral.share_link_base_url` (an https web address with no path,
        query, fragment or trailing slash, never containing "agent"), and the
        code is URL-encoded. `qrPayload` is exactly `link`. The setting is
        seeded `null` and read on every call: while it is `null` (or not
        usable) both are `null`; once a Super Admin sets it, every link
        appears with no deploy. A link that would contain "agent" in any case
        is never returned (the item's `link` and `qrPayload` are `null`).

        The member web app reads `?ref=` and fills its referral code box with
        it; the member still confirms it there.

        The `code` and the `shareMessages` are **always** returned. While
        `link` is null the share messages are the code-only wording; once a
        link exists they end with it on its own line. Clients must render the
        code (and a "Copy code" action) whether or not a link is present,
        show "Copy link" for `link` and "Download QR" for a QR image drawn
        from `qrPayload`, and hide both when they are null.
      operationId: agentReferralLinks
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptVersion'
      responses:
        '200':
          description: Codes.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReferralLink' }
              examples:
                withLink:
                  summary: The web address is set (https://testapp.nenjammatrimony.com)
                  value:
                    items:
                      - codeId: 7c2e9a14-5b3d-4f6e-8a10-2d4c6e8f0a12
                        code: NM7K2P9X
                        isPrimary: true
                        link: 'https://testapp.nenjammatrimony.com/?ref=NM7K2P9X'
                        qrPayload: 'https://testapp.nenjammatrimony.com/?ref=NM7K2P9X'
                        shareMessages:
                          - id: default
                            text:
                              en: "Hi! I'm Ravi Kumar. Join Nenjam, a trusted matrimony app, and use my referral code NM7K2P9X when you sign up to get 5% off your first plan.\nhttps://testapp.nenjammatrimony.com/?ref=NM7K2P9X"
                              ta: "வணக்கம்! நான் Ravi Kumar. நம்பகமான திருமண வரன் தேடல் செயலியான \"நெஞ்சம்\" (Nenjam)-இல் இணையுங்கள். பதிவு செய்யும்போது என் பரிந்துரைக் குறியீடு NM7K2P9X பயன்படுத்தினால், உங்கள் முதல் திட்டத்தில் 5% தள்ளுபடி கிடைக்கும்.\nhttps://testapp.nenjammatrimony.com/?ref=NM7K2P9X"
                        shareable: true
                noLink:
                  summary: The web address is not set yet (the seeded null)
                  value:
                    items:
