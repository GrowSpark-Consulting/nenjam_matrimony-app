name: nenjam_matrimony
description: "Nenjam Matrimony — AI-powered premium matrimonial platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI & Design
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  # Utilities
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.4
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  equatable: ^2.0.7
  flutter_hooks: ^0.20.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - .env.dev
    - .env.qa
    - .env.staging
    - .env.production
    - assets/icons/
    - assets/images/
    - assets/svg/
    - assets/animations/
    - assets/lottie/
    - assets/illustrations/
