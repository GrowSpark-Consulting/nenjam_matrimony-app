# Nenjam Matrimony — Localization configuration
#
# Consumed by `flutter gen-l10n` (runs automatically on `flutter pub get`
# because `flutter: generate: true` is set in pubspec.yaml).
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
output-dir: lib/l10n

