# Gradle daemon heap. 2G was not enough for this project and builds died with
# "Java heap space" while resolving :app:debugCompileClasspath. Metaspace is
# raised alongside it because AGP 8 + Kotlin 2.2 load a lot of classes.
#
# No -XX:+HeapDumpOnOutOfMemoryError here on purpose: an OOM in the daemon
# writes a java_pid*.hprof the size of the heap (1.5 GB+) into android/, which
# is far more painful than the stack trace is useful. Add it back temporarily
# if you are actually chasing a leak.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m

# The Kotlin compile daemon is a separate JVM from the Gradle daemon and does
# NOT inherit org.gradle.jvmargs; without this it falls back to a small default
# and :app:compileDebugKotlin OOMs on its own.
kotlin.daemon.jvmargs=-Xmx2G

android.useAndroidX=true

# Jetifier stays OFF. It rewrites every jar on the compile classpath from the
# old com.android.support namespace to AndroidX -- including Flutter's ~1 GB
# engine jar, which is what exhausted the heap above. Nothing here needs it:
# no dependency references com.android.support or android.arch. Only turn it
# back on if a plugin actually pulls in a pre-AndroidX artifact, and raise the
# heap further if you do.
android.enableJetifier=false

# Deliberately NOT setting org.gradle.parallel / org.gradle.caching. With ~40
# Flutter plugin subprojects, parallel execution let Gradle snapshot
# :app:stripDebugDebugSymbols' output directory while AGP was still writing
# libflutter.so through a .temp-stream-* file, failing the build with
# "Failed to create MD5 hash ... as it does not exist". The speedup is not
# worth a racy build.

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
