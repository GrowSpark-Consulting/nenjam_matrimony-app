name: nenjam_matrimony
description: "Nenjam Matrimony — AI-powered premium matrimonial platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2
  # Floor, not decoration: `flutter pub get` refuses to resolve on an older
  # SDK, so the whole team and CI stay on one toolchain. Set after a real
  # divergence — CupertinoPageTransitionsBuilder is re-exported by
  # material.dart on 3.35.x but not on 3.44.x, so code that analyzed clean
  # locally failed in CI (and vice versa) purely from a version gap.
  # CI pins the exact version; this pins the minimum.
  flutter: ">=3.44.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI & Design
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  # Profile photo picking. The crop screen (core/services/media) now owns
  # final downscale/compression post-crop, so picking itself just needs a
  # generous resolution ceiling — see PhotoCropScreen/ImageCompressor.
  image_picker: ^1.1.2
  # The platform-neutral file handle image_picker already returns. Declared
  # directly because the media chain (crop, compress, multipart upload) and
  # the repositories now take XFile rather than dart:io's File, so those
  # layers compile and run in the browser as well as on Android/iOS.
  cross_file: ^0.3.4+2
  # Pure-Dart JPEG encode/decode for the crop & adjust screen's compression
  # step — no native platform channel, so it works identically on every
  # platform this app targets (including desktop, unlike native compressors).
  image: ^4.8.0
  flutter_animate: ^4.5.2
  # Runtime permission status/request for camera + notifications only —
  # gallery access goes through the system photo picker and needs no
  # runtime permission, so it deliberately does not use this package.
  permission_handler: ^11.3.1
  # Emoji keyboard for the chat composer — inserts plain Unicode text at the
  # cursor via a TextEditingController, no custom message type involved.
  emoji_picker_flutter: ^4.4.0
  # Voice message recording (local file) and local playback preview. No
  # chat media-upload endpoint exists yet — see
  # docs/development/chat-backend-handoff.md — so these are wired for
  # record/preview/cancel only until that lands.
  record: ^6.2.1
  audioplayers: ^6.0.0
  # Already pulled in transitively (cached_network_image -> flutter_cache_manager)
  # but voice recording needs its temp-directory API directly.
  path_provider: ^2.1.5

  # Utilities
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.4
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  equatable: ^2.0.7
  flutter_hooks: ^0.20.5
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  flutter_slidable: ^4.0.3
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^20.1.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  # Enable code generation for localization (flutter gen-l10n)
  generate: true

  assets:
    - .env.dev
    - .env.qa
    - .env.staging
    - .env.production
    - assets/icons/
    - assets/images/
    - assets/svg/
    - assets/animations/
    - assets/lottie/
    - assets/illustrations/
