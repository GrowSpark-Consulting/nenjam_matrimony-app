<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nenjam Matrimony — Find Your Forever. A premium Indian matrimony app.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6B21A8">

  <!-- Google Sign-In, web only. google_sign_in_web reads the OAuth client id
       from this tag; without it initialize() cannot run and the button fails
       before the account picker ever opens. Android and iOS take theirs from
       google-services.json / GoogleService-Info.plist instead, which is where
       this value is copied from (the client_type 3 "web" entry) rather than
       being a second source of truth.

       Not a secret: an OAuth client id is public by design, ships in every web
       bundle, and is already committed in android/app/google-services.json.
       Security comes from the authorized JavaScript origins configured for
       this client in the Google Cloud console — any origin serving the app
       (including a local dev port) has to be listed there. -->
  <meta name="google-signin-client_id"
        content="1060875646049-lj6dfvsbb05o7jpi70jma08m5iv2nat3.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nenjam Matrimony">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nenjam Matrimony</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#FFF9FC">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
